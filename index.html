<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>10xvick Portal | Games & Projects</title>
    <meta name="description" content="Discover games, emulators, and development projects by 10xvick, hosted on GitHub Pages." />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
      :root {
        --bg-color: #0b0c10;
        --card-bg: rgba(31, 40, 51, 0.4);
        --card-border: rgba(102, 252, 241, 0.1);
        --text-primary: #ffffff;
        --text-secondary: #c5c6c7;
        --accent-cyan: #66fcf1;
        --accent-blue: #45f3ff;
        --accent-purple: #8a2be2;
        --glow-strength: 15px;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Outfit', sans-serif;
        background-color: var(--bg-color);
        color: var(--text-primary);
        min-height: 100vh;
        overflow-x: hidden;
        background-image: 
          radial-gradient(circle at 10% 20%, rgba(138, 43, 226, 0.15) 0%, transparent 40%),
          radial-gradient(circle at 90% 80%, rgba(102, 252, 241, 0.15) 0%, transparent 40%);
        background-attachment: fixed;
      }

      /* Header styling */
      header {
        max-width: 1200px;
        margin: 0 auto;
        padding: 60px 20px 40px;
        text-align: center;
      }

      h1 {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 3.5rem;
        font-weight: 800;
        letter-spacing: -1px;
        margin-bottom: 15px;
        background: linear-gradient(135deg, #fff 30%, var(--accent-cyan) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 0 30px rgba(102, 252, 241, 0.2);
      }

      .subtitle {
        font-size: 1.2rem;
        color: var(--text-secondary);
        max-width: 600px;
        margin: 0 auto;
        line-height: 1.6;
        font-weight: 300;
      }

      /* Projects grid container */
      main {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 20px 80px;
      }

      .grid-container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 25px;
        margin-top: 40px;
      }

      /* Premium Card styling */
      .card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 16px;
        padding: 30px;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        position: relative;
        overflow: hidden;
        transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-height: 240px;
        color: inherit;
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      }

      .card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, rgba(102, 252, 241, 0.1), transparent);
        opacity: 0;
        transition: opacity 0.4s ease;
        z-index: 0;
      }

      .card:hover {
        transform: translateY(-8px);
        border-color: rgba(102, 252, 241, 0.4);
        box-shadow: 
          0 12px 40px 0 rgba(0, 0, 0, 0.4),
          0 0 var(--glow-strength) rgba(102, 252, 241, 0.2);
      }

      .card:hover::before {
        opacity: 1;
      }

      .card-content {
        position: relative;
        z-index: 1;
      }

      .category-tag {
        display: inline-block;
        font-family: 'Space Grotesk', sans-serif;
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        color: var(--accent-cyan);
        letter-spacing: 1.5px;
        margin-bottom: 12px;
        background: rgba(102, 252, 241, 0.1);
        padding: 4px 10px;
        border-radius: 50px;
        border: 1px solid rgba(102, 252, 241, 0.2);
      }

      .project-title-link {
        text-decoration: none;
        color: inherit;
        display: inline-block;
      }

      .project-title {
        font-size: 1.5rem;
        font-weight: 600;
        margin-bottom: 10px;
        color: var(--text-primary);
        line-height: 1.25;
        transition: color 0.3s ease;
      }

      .project-title-link:hover .project-title {
        color: var(--accent-cyan);
      }

      .project-desc {
        color: var(--text-secondary);
        font-size: 0.95rem;
        line-height: 1.5;
        font-weight: 300;
      }

      .card-footer {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 25px;
        padding-top: 15px;
        border-top: 1px solid rgba(255, 255, 255, 0.05);
      }

      .visit-link {
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--text-primary);
        display: inline-flex;
        align-items: center;
        gap: 6px;
        text-decoration: none;
        transition: color 0.3s ease;
      }

      .visit-link:hover {
        color: var(--accent-cyan);
      }

      .visit-link svg {
        transition: transform 0.3s ease;
        fill: currentColor;
      }

      .visit-link:hover svg {
        transform: translateX(4px);
      }

      .repo-link {
        font-size: 0.85rem;
        font-weight: 500;
        color: var(--text-secondary);
        display: inline-flex;
        align-items: center;
        gap: 6px;
        text-decoration: none;
        transition: color 0.3s ease;
      }

      .repo-link:hover {
        color: var(--accent-cyan);
      }

      /* Loader styles */
      .loader-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 60px 0;
      }

      .spinner {
        width: 50px;
        height: 50px;
        border: 3px solid rgba(102, 252, 241, 0.1);
        border-radius: 50%;
        border-top-color: var(--accent-cyan);
        animation: spin 1s ease-in-out infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .loading-text {
        margin-top: 20px;
        font-size: 1rem;
        color: var(--text-secondary);
        font-weight: 300;
        letter-spacing: 1px;
      }

      /* Error/Fallback display */
      .error-container {
        text-align: center;
        padding: 40px;
        border: 1px dashed rgba(255, 0, 0, 0.2);
        border-radius: 12px;
        background: rgba(255, 0, 0, 0.05);
        margin-top: 40px;
      }

      .error-title {
        color: #ff6b6b;
        font-size: 1.2rem;
        margin-bottom: 10px;
      }

      /* Responsive Adjustments */
      @media (max-width: 768px) {
        h1 {
          font-size: 2.5rem;
        }
        header {
          padding: 40px 15px 20px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1 id="main-title">10xvick Portal</h1>
      <p class="subtitle">A dynamic directory of emulators, games, tools, and interactive playground environments hosted on GitHub Pages.</p>
    </header>

    <main>
      <div id="loader" class="loader-container">
        <div class="spinner"></div>
        <p class="loading-text">SCANNING PORTFOLIO DEPLOYMENTS...</p>
      </div>

      <div id="error-box" class="error-container" style="display: none;">
        <h3 class="error-title">GitHub API Limit Reached or Failed</h3>
        <p style="color: var(--text-secondary); font-size: 0.95rem; margin-bottom: 20px;">
          Using cached direct links below to navigate the playground:
        </p>
        <div id="fallback-links" class="grid-container"></div>
      </div>

      <div id="projects-grid" class="grid-container" style="display: none;"></div>
    </main>

    <script>
      const USERNAME = "10xvick";
      
      // Known fallback links in case the API limit is hit or network request fails
      const fallbackProjects = [
        { title: "SNES Emulator", url: `https://${USERNAME}.github.io/emulator/snes/`, repoUrl: `https://github.com/${USERNAME}/snes-emulator`, category: "emulator", desc: "A browser-based Super Nintendo Entertainment System (SNES) emulator written in TypeScript." },
        { title: "World Simulator", url: `https://${USERNAME}.github.io/games/sims/`, repoUrl: `https://github.com/${USERNAME}/sims`, category: "games", desc: "A sophisticated life and social simulator featuring needs, career progression, autonomy, and emotions." },
        { title: "Arcade Station", url: `https://${USERNAME}.github.io/games/arcade-station/`, repoUrl: `https://github.com/${USERNAME}/arcade-station`, category: "games", desc: "A 3D WebGL arcade cabinet playground featuring 49 built-in classic retro games." },
        { title: "Bot Tree", url: `https://${USERNAME}.github.io/tools/chat/bottree/`, repoUrl: `https://github.com/${USERNAME}/bottree`, category: "tools", desc: "Interactive chat bot decision tree visualizer." },
        { title: "Raster Script", url: `https://${USERNAME}.github.io/tools/image/rasterscript/`, repoUrl: `https://github.com/${USERNAME}/rasterscript`, category: "tools", desc: "Interactive image rasterization and parsing script playground." },
        { title: "Nexroom", url: `https://${USERNAME}.github.io/tools/social/nexroom/`, repoUrl: `https://github.com/${USERNAME}/nexroom`, category: "tools", desc: "Social room interaction layout builder." }
      ];

      // Formats project titles from raw folder structures
      function formatTitle(name) {
        let parts = name.split('/').filter(Boolean);
        let lastPart = parts[parts.length - 1];
        
        const overrides = {
          'snes': 'SNES Emulator',
          'sims': 'World Simulator',
          'arcade-station': 'Arcade Station',
          'bottree': 'Bot Tree',
          'rasterscript': 'Raster Script',
          'nexroom': 'Nexroom'
        };

        if (overrides[lastPart.toLowerCase()]) {
          return overrides[lastPart.toLowerCase()];
        }

        return lastPart
          .split('-')
          .map(word => word.charAt(0).toUpperCase() + word.slice(1))
          .join(' ');
      }

      // Automatically determine the category tag based on directory hierarchy
      function determineCategory(path) {
        if (path.includes('emulator')) return 'emulator';
        if (path.includes('games') || path.includes('spinner') || path.includes('game') || path.includes('arcade')) return 'games';
        if (path.includes('tools') || path.includes('chat') || path.includes('image')) return 'tools';
        return 'playground';
      }

      // Dynamically matches subfolders to their respective code repositories
      function determineRepoUrl(path, allRepos) {
        let parts = path.split('/').filter(Boolean);
        let lastPart = parts[parts.length - 1];

        if (lastPart === 'snes') return `https://github.com/${USERNAME}/snes-emulator`;
        if (lastPart === 'sims') return `https://github.com/${USERNAME}/sims`;
        if (lastPart === 'arcade-station') return `https://github.com/${USERNAME}/arcade-station`;

        if (allRepos && allRepos.some(r => r.name.toLowerCase() === lastPart.toLowerCase())) {
          return `https://github.com/${USERNAME}/${lastPart}`;
        }
        
        // Link to the specific subfolder in the landing page repository
        return `https://github.com/${USERNAME}/${USERNAME}.github.io/tree/main/${path}`;
      }


      // Extracts a basic description from the README markdown content
      function extractDescriptionFromReadme(markdown) {
        if (!markdown) return "";
        const lines = markdown.split("\n");
        let description = "";
        
        for (let i = 0; i < lines.length; i++) {
          let line = lines[i].trim();
          
          // Skip empty lines, headers, badges/images, code blocks, dividers
          if (!line || line.startsWith("#") || line.startsWith("---") || line.startsWith("`") || line.startsWith("!")) {
            continue;
          }
          
          // Skip HTML blocks/tags entirely if they are alignment, center, or image tags
          if (line.startsWith("<") && (line.includes("align=") || line.includes("p ") || line.includes("img "))) {
            continue;
          }
          
          // Strip blockquote character if present
          if (line.startsWith(">")) {
            line = line.substring(1).trim();
          }
          
          // Clean up markdown formatting
          line = line.replace(/[\*_~`]/g, ""); // Strip bold, italic, code accents
          line = line.replace(/\[([^\]]+)\]\([^\)]+\)/g, "$1"); // Strip markdown links, leaving text
          line = line.replace(/<[^>]*>/g, ""); // Strip inline HTML
          
          if (line) {
            description = line;
            break;
          }
        }
        
        if (description.length > 200) {
          const truncated = description.substring(0, 200);
          const lastSpace = truncated.lastIndexOf(" ");
          description = (lastSpace > 150 ? truncated.substring(0, lastSpace) : truncated) + "...";
        }
        
        return description;
      }

      // Fetches the README description from GitHub raw content
      async function getReadmeDescription(repoUrl, apiDescription) {
        if (!repoUrl || !repoUrl.includes("github.com")) {
          return apiDescription || "";
        }
        
        try {
          const urlObj = new URL(repoUrl);
          const pathParts = urlObj.pathname.split("/").filter(Boolean);
          if (pathParts.length < 2) return apiDescription || "";
          
          const owner = pathParts[0];
          const repo = pathParts[1];
          
          let pathsToTry = [];
          if (repo === `${USERNAME}.github.io` && pathParts.includes("tree")) {
            const branchIdx = pathParts.indexOf("tree") + 1;
            const branch = pathParts[branchIdx] || "main";
            const subFolder = pathParts.slice(branchIdx + 1).join("/");
            pathsToTry.push(`https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${subFolder}/README.md`);
            pathsToTry.push(`https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${subFolder}/readme.md`);
          } else {
            pathsToTry.push(`https://raw.githubusercontent.com/${owner}/${repo}/main/README.md`);
            pathsToTry.push(`https://raw.githubusercontent.com/${owner}/${repo}/main/readme.md`);
            pathsToTry.push(`https://raw.githubusercontent.com/${owner}/${repo}/master/README.md`);
            pathsToTry.push(`https://raw.githubusercontent.com/${owner}/${repo}/master/readme.md`);
          }
          
          let markdown = "";
          for (const readmeUrl of pathsToTry) {
            try {
              const res = await fetch(readmeUrl);
              if (res.ok) {
                markdown = await res.text();
                break;
              }
            } catch (e) {
              // Ignore and try next path
            }
          }
          
          if (!markdown) {
            return apiDescription || "";
          }
          
          const desc = extractDescriptionFromReadme(markdown);
          return desc || apiDescription || "";
        } catch (error) {
          console.error("Error fetching README:", error);
          return apiDescription || "";
        }
      }

      function renderProjects(projects) {
        const grid = document.getElementById("projects-grid");
        grid.innerHTML = "";
        
        projects.forEach(p => {
          const card = document.createElement("div");
          card.className = "card";
          card.id = `project-${p.title.toLowerCase().replace(/[^a-z0-9]/g, '-')}`;
          const descId = `desc-${p.title.toLowerCase().replace(/[^a-z0-9]/g, '-')}`;
          
          card.innerHTML = `
            <div class="card-content">
              <span class="category-tag">${p.category}</span>
              <a href="${p.url}" class="project-title-link">
                <h2 class="project-title">${p.title}</h2>
              </a>
              <p class="project-desc" id="${descId}">${p.desc || 'Fetching project description...'}</p>
            </div>
            <div class="card-footer">
              <a href="${p.url}" class="visit-link">
                Launch Project 
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                  <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
              </a>
              ${p.repoUrl ? `
                <a href="${p.repoUrl}" class="repo-link" target="_blank" rel="noopener noreferrer">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path>
                  </svg>
                  Source Code
                </a>
              ` : ''}
            </div>
          `;
          grid.appendChild(card);
          
          // Asynchronously load the README description
          getReadmeDescription(p.repoUrl, p.desc).then(readmeDesc => {
            const el = document.getElementById(descId);
            if (el && readmeDesc) {
              el.textContent = readmeDesc;
            }
          });
        });

        document.getElementById("loader").style.display = "none";
        grid.style.display = "grid";
      }

      function showFallback() {
        document.getElementById("loader").style.display = "none";
        document.getElementById("error-box").style.display = "block";
        
        const fallbackGrid = document.getElementById("fallback-links");
        fallbackGrid.innerHTML = "";
        fallbackProjects.forEach(p => {
          const card = document.createElement("div");
          card.className = "card";
          const descId = `desc-fallback-${p.title.toLowerCase().replace(/[^a-z0-9]/g, '-')}`;
          card.innerHTML = `
            <div class="card-content">
              <span class="category-tag">${p.category}</span>
              <a href="${p.url}" class="project-title-link">
                <h2 class="project-title">${p.title}</h2>
              </a>
              <p class="project-desc" id="${descId}">${p.desc}</p>
            </div>
            <div class="card-footer">
              <a href="${p.url}" class="visit-link">Launch Project</a>
              <a href="${p.repoUrl}" class="repo-link" target="_blank" rel="noopener noreferrer">Source Code</a>
            </div>
          `;
          fallbackGrid.appendChild(card);
          
          // Asynchronously attempt to load dynamic README description for fallback too
          getReadmeDescription(p.repoUrl, p.desc).then(readmeDesc => {
            const el = document.getElementById(descId);
            if (el && readmeDesc) {
              el.textContent = readmeDesc;
            }
          });
        });
      }

      async function scanDeployments() {
        try {
          const endpoints = [
            `https://api.github.com/repos/${USERNAME}/${USERNAME}.github.io/git/trees/main?recursive=1`,
            `https://api.github.com/users/${USERNAME}/repos?per_page=100`
          ];
          
          const [treeRes, reposRes] = await Promise.all([
            fetch(endpoints[0]),
            fetch(endpoints[1])
          ]);

          if (!treeRes.ok || !reposRes.ok) {
            console.warn("GitHub API request failed or rate limit hit. Loading fallback static dashboard.");
            showFallback();
            return;
          }

          const treeData = await treeRes.json();
          const reposData = await reposRes.json();

          const projects = [];
          const pathsSeen = new Set();

          // 1. Scan tree index.html files
          if (treeData.tree) {
            treeData.tree.forEach(item => {
              if (item.type === "blob" && item.path.endsWith("index.html")) {
                const subpath = item.path.slice(0, -10); // strip "index.html"
                if (subpath && subpath !== "") {
                  pathsSeen.add(subpath.replace(/\/$/, ""));
                  
                  const title = formatTitle(subpath);
                  const category = determineCategory(subpath);
                  const repoUrl = determineRepoUrl(subpath, reposData);
                  
                  const fallbackMatch = fallbackProjects.find(fp => fp.url.includes(subpath));
                  const lastPartName = subpath.split('/').filter(Boolean).pop().toLowerCase();
                  const matchedRepo = reposData.find(r => 
                    r.name.toLowerCase() === lastPartName || 
                    (lastPartName === 'snes' && r.name.toLowerCase() === 'snes-emulator')
                  );
                  const desc = fallbackMatch ? fallbackMatch.desc : (matchedRepo?.description || "");

                  projects.push({
                    title,
                    url: `https://${USERNAME}.github.io/${subpath}`,
                    repoUrl,
                    category,
                    desc
                  });
                }
              }
            });
          }

          // 2. Scan other repositories with pages enabled
          reposData.forEach(repo => {
            if (repo.has_pages && repo.name !== `${USERNAME}.github.io`) {
              const cleanedName = repo.name.replace(/\/$/, "");
              
              // Filter out repositories already hosted as a subfolder of 10xvick.github.io
              // e.g. 'games/sims' contains/ends with 'sims', so we ignore the root repo pages URL
              const alreadySeenAsSubfolder = Array.from(pathsSeen).some(path => 
                path === cleanedName || path.endsWith('/' + cleanedName)
              );

              if (!alreadySeenAsSubfolder && !pathsSeen.has(cleanedName)) {
                const title = formatTitle(repo.name);
                const category = determineCategory(repo.name);
                const desc = repo.description || "";
                
                projects.push({
                  title,
                  url: `https://${USERNAME}.github.io/${repo.name}/`,
                  repoUrl: repo.html_url,
                  category,
                  desc
                });
              }
            }
          });


          if (projects.length === 0) {
            renderProjects(fallbackProjects);
          } else {
            renderProjects(projects);
          }

        } catch (error) {
          console.error("Error scanning deployments:", error);
          showFallback();
        }
      }

      scanDeployments();
    </script>
  </body>
</html>
