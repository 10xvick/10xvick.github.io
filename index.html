<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>10xvick Portal | Games & Projects</title>
    <meta name="description" content="Discover games, emulators, and development projects by 10xvick, hosted on GitHub Pages." />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
      :root {
        --bg-color: #0b0c10;
        --card-bg: rgba(31, 40, 51, 0.4);
        --card-border: rgba(102, 252, 241, 0.1);
        --text-primary: #ffffff;
        --text-secondary: #c5c6c7;
        --accent-cyan: #66fcf1;
        --accent-blue: #45f3ff;
        --accent-purple: #8a2be2;
        --glow-strength: 15px;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Outfit', sans-serif;
        background-color: var(--bg-color);
        color: var(--text-primary);
        min-height: 100vh;
        overflow-x: hidden;
        background-image: 
          radial-gradient(circle at 10% 20%, rgba(138, 43, 226, 0.15) 0%, transparent 40%),
          radial-gradient(circle at 90% 80%, rgba(102, 252, 241, 0.15) 0%, transparent 40%);
        background-attachment: fixed;
      }

      /* Header styling */
      header {
        max-width: 1200px;
        margin: 0 auto;
        padding: 60px 20px 40px;
        text-align: center;
      }

      h1 {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 3.5rem;
        font-weight: 800;
        letter-spacing: -1px;
        margin-bottom: 15px;
        background: linear-gradient(135deg, #fff 30%, var(--accent-cyan) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 0 30px rgba(102, 252, 241, 0.2);
      }

      .subtitle {
        font-size: 1.2rem;
        color: var(--text-secondary);
        max-width: 600px;
        margin: 0 auto;
        line-height: 1.6;
        font-weight: 300;
      }

      /* Projects grid container */
      main {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 20px 80px;
      }

      .grid-container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 25px;
        margin-top: 40px;
      }

      /* Premium Card styling */
      .card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 16px;
        padding: 30px;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        position: relative;
        overflow: hidden;
        transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-height: 220px;
        text-decoration: none;
        color: inherit;
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      }

      .card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, rgba(102, 252, 241, 0.1), transparent);
        opacity: 0;
        transition: opacity 0.4s ease;
        z-index: 0;
      }

      .card:hover {
        transform: translateY(-8px);
        border-color: rgba(102, 252, 241, 0.4);
        box-shadow: 
          0 12px 40px 0 rgba(0, 0, 0, 0.4),
          0 0 var(--glow-strength) rgba(102, 252, 241, 0.2);
      }

      .card:hover::before {
        opacity: 1;
      }

      .card-content {
        position: relative;
        z-index: 1;
      }

      .category-tag {
        display: inline-block;
        font-family: 'Space Grotesk', sans-serif;
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        color: var(--accent-cyan);
        letter-spacing: 1.5px;
        margin-bottom: 12px;
        background: rgba(102, 252, 241, 0.1);
        padding: 4px 10px;
        border-radius: 50px;
        border: 1px solid rgba(102, 252, 241, 0.2);
      }

      .project-title {
        font-size: 1.5rem;
        font-weight: 600;
        margin-bottom: 10px;
        color: var(--text-primary);
        line-height: 1.25;
      }

      .project-desc {
        color: var(--text-secondary);
        font-size: 0.95rem;
        line-height: 1.5;
        font-weight: 300;
      }

      .card-footer {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 25px;
        padding-top: 15px;
        border-top: 1px solid rgba(255, 255, 255, 0.05);
      }

      .visit-link {
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--text-primary);
        display: flex;
        align-items: center;
        gap: 6px;
        transition: color 0.3s ease;
      }

      .card:hover .visit-link {
        color: var(--accent-cyan);
      }

      .visit-link svg {
        transition: transform 0.3s ease;
        fill: currentColor;
      }

      .card:hover .visit-link svg {
        transform: translateX(4px);
      }

      /* Loader styles */
      .loader-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 60px 0;
      }

      .spinner {
        width: 50px;
        height: 50px;
        border: 3px solid rgba(102, 252, 241, 0.1);
        border-radius: 50%;
        border-top-color: var(--accent-cyan);
        animation: spin 1s ease-in-out infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .loading-text {
        margin-top: 20px;
        font-size: 1rem;
        color: var(--text-secondary);
        font-weight: 300;
        letter-spacing: 1px;
      }

      /* Error/Fallback display */
      .error-container {
        text-align: center;
        padding: 40px;
        border: 1px dashed rgba(255, 0, 0, 0.2);
        border-radius: 12px;
        background: rgba(255, 0, 0, 0.05);
        margin-top: 40px;
      }

      .error-title {
        color: #ff6b6b;
        font-size: 1.2rem;
        margin-bottom: 10px;
      }

      /* Responsive Adjustments */
      @media (max-width: 768px) {
        h1 {
          font-size: 2.5rem;
        }
        header {
          padding: 40px 15px 20px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1 id="main-title">10xvick Portal</h1>
      <p class="subtitle">A dynamic directory of emulators, games, tools, and interactive playground environments hosted on GitHub Pages.</p>
    </header>

    <main>
      <div id="loader" class="loader-container">
        <div class="spinner"></div>
        <p class="loading-text">SCANNING PORTFOLIO DEPLOYMENTS...</p>
      </div>

      <div id="error-box" class="error-container" style="display: none;">
        <h3 class="error-title">GitHub API Limit Reached or Failed</h3>
        <p style="color: var(--text-secondary); font-size: 0.95rem; margin-bottom: 20px;">
          Using cached direct links below to navigate the playground:
        </p>
        <div id="fallback-links" class="grid-container"></div>
      </div>

      <div id="projects-grid" class="grid-container" style="display: none;"></div>
    </main>

    <script>
      const USERNAME = "10xvick";
      
      // Known fallback links in case the API limit is hit or network request fails
      const fallbackProjects = [
        { title: "SNES Emulator", url: `https://${USERNAME}.github.io/emulator/snes/`, category: "emulator", desc: "A browser-based Super Nintendo Entertainment System (SNES) emulator written in TypeScript." },
        { title: "World Simulator", url: `https://${USERNAME}.github.io/games/sims/`, category: "games", desc: "A sophisticated life and social simulator featuring needs, career progression, autonomy, and emotions." },
        { title: "Snake Spinner", url: `https://${USERNAME}.github.io/snake-spinner/`, category: "games", desc: "Classic snake game variation with spin mechanics." },
        { title: "Bot Tree", url: `https://${USERNAME}.github.io/tools/chat/bottree/`, category: "tools", desc: "Interactive chat bot decision tree visualizer." },
        { title: "Raster Script", url: `https://${USERNAME}.github.io/tools/image/rasterscript/`, category: "tools", desc: "Interactive image rasterization and parsing script playground." },
        { title: "Nexroom", url: `https://${USERNAME}.github.io/tools/social/nexroom/`, category: "tools", desc: "Social room interaction layout builder." }
      ];

      // Formats project titles from raw folder structures
      function formatTitle(name) {
        // e.g. "emulator/snes/" -> "SNES Emulator"
        // e.g. "snake-spinner" -> "Snake Spinner"
        let parts = name.split('/').filter(Boolean);
        let lastPart = parts[parts.length - 1];
        
        // Custom overrides for prettier display
        const overrides = {
          'snes': 'SNES Emulator',
          'sims': 'World Simulator',
          'bottree': 'Bot Tree',
          'rasterscript': 'Raster Script',
          'nexroom': 'Nexroom'
        };

        if (overrides[lastPart.toLowerCase()]) {
          return overrides[lastPart.toLowerCase()];
        }

        return lastPart
          .split('-')
          .map(word => word.charAt(0).toUpperCase() + word.slice(1))
          .join(' ');
      }

      // Automatically determine the category tag based on directory hierarchy
      function determineCategory(path) {
        if (path.includes('emulator')) return 'emulator';
        if (path.includes('games') || path.includes('spinner') || path.includes('game')) return 'games';
        if (path.includes('tools') || path.includes('chat') || path.includes('image')) return 'tools';
        return 'playground';
      }

      // Simple generic desc generator if none is provided
      function generateDesc(path, category) {
        const title = formatTitle(path);
        return `Interactive ${category} deployment. Click below to launch the ${title} interface directly.`;
      }

      function renderProjects(projects) {
        const grid = document.getElementById("projects-grid");
        grid.innerHTML = "";
        
        projects.forEach(p => {
          const card = document.createElement("a");
          card.className = "card";
          card.href = p.url;
          card.id = `project-${p.title.toLowerCase().replace(/[^a-z0-9]/g, '-')}`;
          
          card.innerHTML = `
            <div class="card-content">
              <span class="category-tag">${p.category}</span>
              <h2 class="project-title">${p.title}</h2>
              <p class="project-desc">${p.desc}</p>
            </div>
            <div class="card-footer">
              <span class="visit-link">
                Launch Project 
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                  <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
              </span>
            </div>
          `;
          grid.appendChild(card);
        });

        document.getElementById("loader").style.display = "none";
        grid.style.display = "grid";
      }

      function showFallback() {
        document.getElementById("loader").style.display = "none";
        document.getElementById("error-box").style.display = "block";
        
        const fallbackGrid = document.getElementById("fallback-links");
        fallbackGrid.innerHTML = "";
        fallbackProjects.forEach(p => {
          const card = document.createElement("a");
          card.className = "card";
          card.href = p.url;
          card.innerHTML = `
            <div class="card-content">
              <span class="category-tag">${p.category}</span>
              <h2 class="project-title">${p.title}</h2>
              <p class="project-desc">${p.desc}</p>
            </div>
            <div class="card-footer">
              <span class="visit-link">Launch Project</span>
            </div>
          `;
          fallbackGrid.appendChild(card);
        });
      }

      async function scanDeployments() {
        try {
          const endpoints = [
            `https://api.github.com/repos/${USERNAME}/${USERNAME}.github.io/git/trees/main?recursive=1`,
            `https://api.github.com/users/${USERNAME}/repos?per_page=100`
          ];
          
          const [treeRes, reposRes] = await Promise.all([
            fetch(endpoints[0]),
            fetch(endpoints[1])
          ]);

          if (!treeRes.ok || !reposRes.ok) {
            console.warn("GitHub API request failed or rate limit hit. Loading fallback static dashboard.");
            showFallback();
            return;
          }

          const treeData = await treeRes.json();
          const reposData = await reposRes.json();

          const projects = [];
          const pathsSeen = new Set();

          // 1. Scan tree index.html files
          if (treeData.tree) {
            treeData.tree.forEach(item => {
              if (item.type === "blob" && item.path.endsWith("index.html")) {
                const subpath = item.path.slice(0, -10); // strip "index.html"
                if (subpath && subpath !== "") {
                  pathsSeen.add(subpath.replace(/\/$/, ""));
                  
                  const title = formatTitle(subpath);
                  const category = determineCategory(subpath);
                  
                  // Look up predefined description if available
                  const fallbackMatch = fallbackProjects.find(fp => fp.url.includes(subpath));
                  const desc = fallbackMatch ? fallbackMatch.desc : generateDesc(subpath, category);

                  projects.push({
                    title,
                    url: `https://${USERNAME}.github.io/${subpath}`,
                    category,
                    desc
                  });
                }
              }
            });
          }

          // 2. Scan other repositories with pages enabled
          reposData.forEach(repo => {
            if (repo.has_pages && repo.name !== `${USERNAME}.github.io`) {
              const cleanedName = repo.name.replace(/\/$/, "");
              if (!pathsSeen.has(cleanedName)) {
                const title = formatTitle(repo.name);
                const category = determineCategory(repo.name);
                const desc = repo.description || generateDesc(repo.name, category);
                
                projects.push({
                  title,
                  url: `https://${USERNAME}.github.io/${repo.name}/`,
                  category,
                  desc
                });
              }
            }
          });

          // If no dynamic projects discovered, render fallback
          if (projects.length === 0) {
            renderProjects(fallbackProjects);
          } else {
            renderProjects(projects);
          }

        } catch (error) {
          console.error("Error scanning deployments:", error);
          showFallback();
        }
      }

      // Initialize scan
      scanDeployments();
    </script>
  </body>
</html>
