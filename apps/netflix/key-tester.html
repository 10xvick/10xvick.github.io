<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Android TV Remote D-Pad Keycode Tester</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: rgba(22, 26, 38, 0.85);
      --card-border: rgba(255, 255, 255, 0.12);
      --text-main: #f0f4fd;
      --text-muted: #8a96b4;
      --accent-cyan: #00f0ff;
      --accent-green: #00ff88;
      --accent-magenta: #ff007f;
      --accent-yellow: #ffcc00;
      --font-main: 'Outfit', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      padding: 20px;
      overflow-x: hidden;
      font-family: var(--font-main);
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(0, 240, 255, 0.15) 0%, transparent 45%),
        radial-gradient(circle at 85% 85%, rgba(255, 0, 127, 0.15) 0%, transparent 45%);
    }

    /* Flash Overlay Animation */
    .flash-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
      opacity: 0;
      transition: opacity 0.05s ease-out;
    }

    .flash-overlay.active {
      background: radial-gradient(circle, rgba(0, 255, 136, 0.5) 0%, transparent 70%);
      opacity: 1;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand h1 {
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff 0%, var(--accent-cyan) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .version-badge {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: 700;
      vertical-align: middle;
      margin-left: 8px;
      padding: 3px 10px;
      border-radius: 12px;
      background: rgba(0, 240, 255, 0.15);
      border: 1px solid rgba(0, 240, 255, 0.35);
      color: var(--accent-cyan);
      -webkit-text-fill-color: var(--accent-cyan);
    }

    /* Huge Diagnostic Counter Card */
    .counter-card {
      background: rgba(0, 255, 136, 0.1);
      border: 2px solid var(--accent-green);
      border-radius: 20px;
      padding: 24px;
      text-align: center;
    }

    .counter-title {
      font-size: 0.9rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--accent-green);
    }

    .counter-number {
      font-family: var(--font-mono);
      font-size: 6.5rem;
      font-weight: 900;
      line-height: 1;
      margin: 12px 0;
      color: #ffffff;
      text-shadow: 0 0 35px rgba(0, 255, 136, 0.5);
    }

    .last-event-name {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--accent-cyan);
    }

    /* Grid Layout */
    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    .log-card {
      grid-column: 1 / -1;
    }

    /* Glass Cards */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 24px;
    }

    /* Log Card Table */
    .log-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .clear-btn {
      font-family: var(--font-main);
      font-weight: 700;
      font-size: 0.9rem;
      padding: 8px 18px;
      border-radius: 10px;
      background: rgba(255, 0, 127, 0.2);
      color: var(--accent-magenta);
      border: 1px solid rgba(255, 0, 127, 0.4);
      cursor: pointer;
    }

    .log-table-wrapper {
      max-height: 320px;
      overflow-y: auto;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      margin-top: 16px;
    }

    .log-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-family: var(--font-mono);
      font-size: 0.9rem;
    }

    .log-table th {
      background: rgba(0, 0, 0, 0.5);
      padding: 12px 16px;
      font-weight: 700;
      color: var(--text-muted);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
    }

    .log-table td {
      padding: 10px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }

    .empty-row td {
      text-align: center;
      padding: 30px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div id="flash-overlay" class="flash-overlay"></div>

  <div class="container">
    <header class="header">
      <div class="brand">
        <h1>Android TV Event Diagnostic <span class="version-badge">v1.6.0</span></h1>
      </div>
      <div style="font-family: var(--font-mono); font-size: 0.9rem; color: var(--accent-cyan);">
        Catching ALL Browser Events
      </div>
    </header>

    <!-- Huge Diagnostic Counter Box -->
    <section class="counter-card" id="counter-card">
      <div class="counter-title">EVENTS CAPTURED COUNT</div>
      <div class="counter-number" id="event-count">0</div>
      <div class="last-event-name" id="last-event-desc">Press any remote button...</div>
    </section>

    <!-- Log History -->
    <section class="card log-card">
      <div class="log-header">
        <h2 style="font-size: 1.2rem; font-weight: 700; color: #fff;">Raw Event Stream</h2>
        <button id="clear-btn" class="clear-btn">Clear Log</button>
      </div>
      
      <div class="log-table-wrapper">
        <table class="log-table">
          <thead>
            <tr>
              <th>Time</th>
              <th>Event Category</th>
              <th>Event Name</th>
              <th>KeyCode / Target</th>
              <th>Raw Details</th>
            </tr>
          </thead>
          <tbody id="log-tbody">
            <tr class="empty-row">
              <td colspan="5">No events captured yet. Press any remote button...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script>
    const flashOverlay = document.getElementById('flash-overlay');
    const counterCard = document.getElementById('counter-card');
    const eventCountEl = document.getElementById('event-count');
    const lastEventDescEl = document.getElementById('last-event-desc');
    const logTbody = document.getElementById('log-tbody');
    const clearBtn = document.getElementById('clear-btn');

    let totalEvents = 0;
    let flashTimer = null;

    // Listen to EVERY POSSIBLE browser event type
    const allEventNames = [
      'keydown', 'keyup', 'keypress',
      'click', 'pointerdown', 'pointerup', 'mousedown', 'mouseup', 'contextmenu', 'auxclick',
      'touchstart', 'touchend', 'touchmove', 'touchcancel',
      'wheel', 'scroll', 'focus', 'blur', 'focusin', 'focusout',
      'input', 'beforeinput', 'compositionstart', 'compositionend'
    ];

    function handleAnyEvent(e) {
      totalEvents++;
      eventCountEl.textContent = totalEvents;

      const evtName = e.type || 'unknown';
      let category = 'KEYBOARD';
      let codeVal = e.keyCode || e.which || e.button || 0;
      let desc = `${evtName.toUpperCase()}`;

      if (e.key) {
        desc += ` (key: "${e.key}")`;
      } else if (e.code) {
        desc += ` (code: "${e.code}")`;
      } else if (e.button !== undefined) {
        category = 'POINTER / MOUSE';
        desc += ` (button: ${e.button})`;
      } else if (e.touches) {
        category = 'TOUCH';
        desc += ` (${e.touches.length} touches)`;
      }

      lastEventDescEl.textContent = `${category}: ${desc}`;

      // Flash feedback
      flashOverlay.className = 'flash-overlay active';
      clearTimeout(flashTimer);
      flashTimer = setTimeout(() => {
        flashOverlay.className = 'flash-overlay';
      }, 150);

      // Log entry
      if (logTbody.querySelector('.empty-row')) {
        logTbody.innerHTML = '';
      }

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${new Date().toLocaleTimeString()}</td>
        <td style="color: var(--accent-green); font-weight:700;">${category}</td>
        <td style="color: var(--accent-cyan);">${evtName}</td>
        <td style="color: var(--accent-yellow); font-weight:800;">${codeVal}</td>
        <td>${escapeHtml(desc)}</td>
      `;

      logTbody.insertBefore(tr, logTbody.firstChild);
      if (logTbody.children.length > 60) {
        logTbody.removeChild(logTbody.lastChild);
      }
    }

    function escapeHtml(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // Attach listeners to window, document, body in capture and bubble phase
    allEventNames.forEach(name => {
      window.addEventListener(name, handleAnyEvent, true);
      window.addEventListener(name, handleAnyEvent, false);
      document.addEventListener(name, handleAnyEvent, true);
    });

    clearBtn.addEventListener('click', () => {
      totalEvents = 0;
      eventCountEl.textContent = '0';
      lastEventDescEl.textContent = 'Log cleared. Press any remote button...';
      logTbody.innerHTML = `
        <tr class="empty-row">
          <td colspan="5">No events captured yet. Press any remote button...</td>
        </tr>
      `;
    });
  </script>
</body>
</html>
